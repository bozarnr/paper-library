name: verify-replication-cards

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run card tests
        run: python -m unittest discover -s tests -v
      - name: Verify replication metadata
        run: python scripts/verify_cards.py
