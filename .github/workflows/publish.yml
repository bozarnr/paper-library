on:
  push:
    branches: main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: |
          pip install jupyter nbformat ipykernel matplotlib pandas numpy -q --break-system-packages
      - run: quarto render
      - run: |
          rm -rf docs/
          cp -r _site docs/
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "deploy: update GitHub Pages"
          file_pattern: docs/
